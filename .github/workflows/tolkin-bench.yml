name: tolkin bench

# Manual-only. The bench is reproducible, but it is also expensive: it builds
# the release tolkin binary, downloads the LLMLingua-2 model on cache miss
# (~57 MB), and runs three tracks against the full fixture set. Nothing is
# published from CI; the artifact is uploaded for download and review.

on:
  workflow_dispatch:
    inputs:
      score:
        description: >-
          Run the BYOK extraction-QA quality scoring (passes the repo's
          ANTHROPIC_API_KEY to the harness with --score-quality). The owner
          keys the run; results carry scored=true with the grader model
          recorded. Off by default.
        type: boolean
        default: false

# Node 20 action runtimes are deprecated; opt into the Node 24 default
# ahead of the 2026-06-16 flip so incompatibilities surface in CI now.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: tolkin-bench-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bench:
    name: tolkin bench harness
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/tolkin-cli

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Install (frozen lockfile, postinstalls blocked by bunfig)
        run: bun install --frozen-lockfile

      # Cache the Hugging Face download dir keyed on the model id so a re-run
      # skips the ~57 MB pull. The model id is part of the cache key (via the
      # path-style suffix) so a model swap invalidates cleanly.
      - name: Cache Hugging Face hub
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: hf-atjsh-llmlingua-2-js-tinybert-meetingbank-v1

      - name: Build tolkin release binary
        run: cargo build --release --manifest-path apps/tolkin-cli/Cargo.toml

      - name: Run bench harness
        if: ${{ !inputs.score }}
        run: bun apps/tolkin-cli/benchmarks/run.ts

      - name: Run bench harness with BYOK quality scoring
        if: ${{ inputs.score }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bun apps/tolkin-cli/benchmarks/run.ts --score-quality

      - name: Upload results.json and RESULTS.md
        uses: actions/upload-artifact@v7
        with:
          name: tolkin-bench-results
          path: |
            apps/tolkin-cli/benchmarks/results.json
            apps/tolkin-cli/benchmarks/RESULTS.md
          if-no-files-found: error
