name: tolkin publish

# Publishes the tolkin npm packages when a version bump lands on main.
# Gated: if the wrapper version in the tree is already on the registry,
# the run is a no-op. Publish order matters: platform packages first,
# wrapper last, so its optionalDependencies resolve at install time.
#
# Structure: a version gate, then a build matrix (one leg per host),
# then a single publish job that downloads every binary artifact and
# stages it into its npm platform package.
#
# Auth is npm Trusted Publishing (OIDC): each package on npmjs.com has
# this repo + this workflow filename configured as its trusted
# publisher, so no token secret is stored or rotated. Requires
# npm >= 11.5.1 (node 24 bundles it) and the id-token permission below.
on:
  push:
    branches: [main]
    paths:
      - "apps/tolkin-cli/**"
      - "packages/tolkin-core/**"
      - ".github/workflows/tolkin-publish.yml"

# Node 20 action runtimes are deprecated; opt into the Node 24 default
# ahead of the 2026-06-16 flip so incompatibilities surface in CI now.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: tolkin-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  gate:
    name: Gate on version (skip when already published)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/tolkin-cli
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
      local: ${{ steps.gate.outputs.local }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Compare tree version against the registry
        id: gate
        run: |
          LOCAL=$(node -p "require('./npm/tolkin/package.json').version")
          PUBLISHED=$(npm view tolkin-cli version 2>/dev/null || echo "none")
          echo "local=$LOCAL" >> "$GITHUB_OUTPUT"
          if [ "$LOCAL" = "$PUBLISHED" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "tolkin-cli@$LOCAL already on the registry; nothing to publish."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Will publish $LOCAL (registry has $PUBLISHED)."
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: gate
    if: needs.gate.outputs.skip == 'false'
    runs-on: ${{ matrix.runner }}
    # The arm64 Linux leg may not be available on every plan; let it fail
    # visibly without blocking the rest of the release. The publish job
    # tolerates its missing artifact.
    continue-on-error: ${{ matrix.runner == 'ubuntu-24.04-arm' }}
    defaults:
      run:
        working-directory: apps/tolkin-cli
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-14 runners are arm64; the x64 binary cross-compiles on
          # the same host (extra_target), exactly as npm/build.sh does.
          - runner: macos-14
            target: aarch64-apple-darwin
            extra_target: x86_64-apple-darwin
          # The linux legs build natively. The tokenizers crate (onig +
          # esaxx_fast features) compiles C and C++ sources, so a system
          # toolchain is required; GitHub's Ubuntu runners ship
          # build-essential by default, no extra step needed.
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          # The windows leg targets MSVC x64 (the stable-x86_64-pc-windows-msvc
          # toolchain ships on windows-2022 by default). tolkin-ci.yml already
          # proves the CLI compiles and tests clean under MSVC.
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.extra_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/tolkin-cli
          key: ${{ matrix.target }}

      - name: Build (native)
        run: cargo build --release

      - name: Smoke the native binary (unix)
        if: runner.os != 'Windows'
        run: ./target/release/tolkin --version

      - name: Smoke the native binary (windows)
        if: runner.os == 'Windows'
        run: .\target\release\tolkin.exe --version

      - uses: actions/upload-artifact@v7
        if: runner.os != 'Windows'
        with:
          name: tolkin-${{ matrix.target }}
          path: apps/tolkin-cli/target/release/tolkin
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: runner.os == 'Windows'
        with:
          name: tolkin-${{ matrix.target }}
          path: apps/tolkin-cli/target/release/tolkin.exe
          if-no-files-found: error

      # The darwin-x64 cross build cannot be smoked on the arm64 host.
      - name: Build (cross, darwin-x64)
        if: matrix.extra_target != ''
        run: cargo build --release --target "${{ matrix.extra_target }}"

      - uses: actions/upload-artifact@v7
        if: matrix.extra_target != ''
        with:
          name: tolkin-${{ matrix.extra_target }}
          path: apps/tolkin-cli/target/${{ matrix.extra_target }}/release/tolkin
          if-no-files-found: error

  publish:
    name: Stage binaries and publish to npm
    needs: [gate, build]
    if: needs.gate.outputs.skip == 'false'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/tolkin-cli
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Confirm npm supports trusted publishing (>= 11.5.1)
        run: npm --version

      - uses: actions/download-artifact@v8
        with:
          path: apps/tolkin-cli/artifacts

      - name: Stage binaries into npm platform packages
        run: |
          stage() {
            SRC="artifacts/tolkin-$1/$2"
            DEST="npm/tolkin-$3/bin/$2"
            if [ -f "$SRC" ]; then
              mkdir -p "$(dirname "$DEST")"
              cp "$SRC" "$DEST"
              chmod +x "$DEST"
              echo "staged $3"
            else
              echo "no artifact for $3 ($SRC absent)"
            fi
          }
          stage aarch64-apple-darwin tolkin darwin-arm64
          stage x86_64-apple-darwin tolkin darwin-x64
          stage x86_64-unknown-linux-gnu tolkin linux-x64
          stage aarch64-unknown-linux-gnu tolkin linux-arm64
          stage x86_64-pc-windows-msvc tolkin.exe win32-x64

      - name: Smoke the staged launcher (linux-x64 binary on this host)
        run: |
          node npm/tolkin/bin/tolkin.js --version
          echo "hello world" | node npm/tolkin/bin/tolkin.js count

      # All six packages were first-published manually on 2026-06-10 and the
      # owner configured trusted publishers for all six against this workflow
      # file, so every publish step is strict. The only tolerated absence is
      # linux-arm64 when its runner was unavailable (handled in-script).
      - name: Publish tolkin-darwin-arm64
        run: |
          V="${{ needs.gate.outputs.local }}"
          if npm view "tolkin-darwin-arm64@$V" version > /dev/null 2>&1; then
            echo "tolkin-darwin-arm64@$V already published; skipping."
          else
            (cd npm/tolkin-darwin-arm64 && npm publish)
          fi

      - name: Publish tolkin-darwin-x64
        run: |
          V="${{ needs.gate.outputs.local }}"
          if npm view "tolkin-darwin-x64@$V" version > /dev/null 2>&1; then
            echo "tolkin-darwin-x64@$V already published; skipping."
          else
            (cd npm/tolkin-darwin-x64 && npm publish)
          fi

      - name: Publish tolkin-linux-x64
        run: |
          V="${{ needs.gate.outputs.local }}"
          if npm view "tolkin-linux-x64@$V" version > /dev/null 2>&1; then
            echo "tolkin-linux-x64@$V already published; skipping."
          else
            (cd npm/tolkin-linux-x64 && npm publish)
          fi

      - name: Publish tolkin-linux-arm64 (skips when the arm build was unavailable)
        run: |
          V="${{ needs.gate.outputs.local }}"
          if [ ! -f npm/tolkin-linux-arm64/bin/tolkin ]; then
            echo "linux-arm64 binary artifact absent (arm runner unavailable or build failed); skipping tolkin-linux-arm64@$V."
          elif npm view "tolkin-linux-arm64@$V" version > /dev/null 2>&1; then
            echo "tolkin-linux-arm64@$V already published; skipping."
          else
            (cd npm/tolkin-linux-arm64 && npm publish)
          fi

      - name: Publish tolkin-win32-x64
        run: |
          V="${{ needs.gate.outputs.local }}"
          if [ ! -f npm/tolkin-win32-x64/bin/tolkin.exe ]; then
            echo "win32-x64 binary artifact absent (windows build failed); skipping tolkin-win32-x64@$V."
          elif npm view "tolkin-win32-x64@$V" version > /dev/null 2>&1; then
            echo "tolkin-win32-x64@$V already published; skipping."
          else
            (cd npm/tolkin-win32-x64 && npm publish)
          fi

      - name: Publish tolkin-cli (wrapper, last)
        run: (cd npm/tolkin && npm publish)

      - name: Verify from the registry
        run: |
          V="${{ needs.gate.outputs.local }}"
          # The registry replicates with a small lag after publish, so every
          # required check retries before failing. The win32 leg once lost a
          # four-second race against its own successful publish (0.11.0); the
          # old form retried only the wrapper.
          require() {
            for i in 1 2 3 4 5 6; do
              if npm view "$1@$V" version > /dev/null 2>&1; then
                echo "$1@$V verified."
                return 0
              fi
              sleep 10
            done
            echo "$1@$V is not on the registry after retries."
            return 1
          }
          # Five packages are hard-required; a miss fails the run.
          require tolkin-cli
          for pkg in tolkin-darwin-arm64 tolkin-darwin-x64 tolkin-linux-x64 tolkin-win32-x64; do
            require "$pkg"
          done
          # linux-arm64 stays warning-only: its runner availability varies by
          # plan, and an unavailable runner means a legitimately absent leg.
          if npm view "tolkin-linux-arm64@$V" version > /dev/null 2>&1; then
            echo "tolkin-linux-arm64@$V verified."
          else
            echo "::warning::tolkin-linux-arm64@$V is not on the registry (arm runner unavailable this run, or its publish failed)."
          fi

  homebrew-release:
    name: Publish binary release and update Homebrew tap
    needs: [gate, publish]
    if: needs.gate.outputs.skip == 'false'
    runs-on: ubuntu-24.04
    # SOFT JOB: stays continue-on-error until the owner completes the
    # first-publish checklist below. Flip to strict (remove this line)
    # after confirming:
    #   1. agnelnieves/tolkin created (the public binary release host)
    #   2. agnelnieves/homebrew-tolkin created (the Homebrew tap repo)
    #   3. Fine-grained PAT with contents read/write on both repos stored
    #      as HOMEBREW_TAP_TOKEN secret on the private monorepo
    # Until those repos and the secret exist every step that uses
    # HOMEBREW_TAP_TOKEN will log a clear message and skip gracefully.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      # Download the four non-Windows binary artifacts produced by the
      # build job. The Windows binary is npm-only; Homebrew covers
      # macOS arm64/x64 and Linux x64/arm64.
      - uses: actions/download-artifact@v8
        with:
          name: aarch64-apple-darwin
          path: artifacts/aarch64-apple-darwin

      - uses: actions/download-artifact@v8
        with:
          name: x86_64-apple-darwin
          path: artifacts/x86_64-apple-darwin

      - uses: actions/download-artifact@v8
        with:
          name: x86_64-unknown-linux-gnu
          path: artifacts/x86_64-unknown-linux-gnu

      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: aarch64-unknown-linux-gnu
          path: artifacts/aarch64-unknown-linux-gnu

      - name: Package binaries into per-platform tarballs
        run: |
          V="${{ needs.gate.outputs.local }}"
          mkdir -p release

          package() {
            ARTIFACT="artifacts/$1/tolkin"
            TARBALL="release/tolkin-v${V}-$2.tar.gz"
            if [ ! -f "$ARTIFACT" ]; then
              echo "artifact for $2 absent; skipping tarball."
              return
            fi
            chmod 0755 "$ARTIFACT"
            # -C so the archive root holds exactly the executable with no
            # directory prefix. This is what the Homebrew formula expects.
            tar -czf "$TARBALL" -C "artifacts/$1" tolkin
            echo "packaged $2: $TARBALL"
          }

          package aarch64-apple-darwin darwin-arm64
          package x86_64-apple-darwin darwin-x64
          package x86_64-unknown-linux-gnu linux-x64
          package aarch64-unknown-linux-gnu linux-arm64

      - name: Write SHA256SUMS
        run: |
          V="${{ needs.gate.outputs.local }}"
          cd release
          # sha256sum over every tarball that was actually produced
          sha256sum tolkin-v${V}-*.tar.gz > SHA256SUMS
          echo "SHA256SUMS:"
          cat SHA256SUMS

      - name: Create GitHub release on agnelnieves/tolkin
        run: |
          V="${{ needs.gate.outputs.local }}"
          if [ -z "${{ secrets.HOMEBREW_TAP_TOKEN }}" ]; then
            echo "HOMEBREW_TAP_TOKEN secret is not set; skipping GitHub release creation."
            echo "Owner action required: create agnelnieves/tolkin and store the PAT as HOMEBREW_TAP_TOKEN."
            exit 0
          fi
          NOTES="tolkin v${V}: see https://github.com/agnelnieves/tolkin#readme and /bench for benchmark results."
          gh release create "v${V}" \
            release/tolkin-v${V}-darwin-arm64.tar.gz \
            release/tolkin-v${V}-darwin-x64.tar.gz \
            release/tolkin-v${V}-linux-x64.tar.gz \
            $(ls release/tolkin-v${V}-linux-arm64.tar.gz 2>/dev/null || true) \
            release/SHA256SUMS \
            --repo agnelnieves/tolkin \
            --title "tolkin v${V}" \
            --notes "$NOTES"
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Update Homebrew tap formula
        run: |
          V="${{ needs.gate.outputs.local }}"
          if [ -z "${{ secrets.HOMEBREW_TAP_TOKEN }}" ]; then
            echo "HOMEBREW_TAP_TOKEN secret is not set; skipping tap update."
            echo "Owner action required: create agnelnieves/homebrew-tolkin and store the PAT as HOMEBREW_TAP_TOKEN."
            exit 0
          fi

          # Extract sha256 values from the SHA256SUMS file
          sha_for() {
            grep "$1" release/SHA256SUMS | awk '{print $1}'
          }

          SHA_DARWIN_ARM64=$(sha_for "darwin-arm64")
          SHA_DARWIN_X64=$(sha_for "darwin-x64")
          SHA_LINUX_X64=$(sha_for "linux-x64")
          SHA_LINUX_ARM64=$(sha_for "linux-arm64")

          # Clone the tap repo using the PAT
          git clone "https://x-access-token:${{ secrets.HOMEBREW_TAP_TOKEN }}@github.com/agnelnieves/homebrew-tolkin.git" tap-repo
          cd tap-repo

          mkdir -p Formula
          # Copy the staged template from this repo
          cp "$GITHUB_WORKSPACE/distribution/homebrew/Formula/tolkin.rb" Formula/tolkin.rb

          # Substitute the version string (the class-level version field and
          # the four download URL paths). Generic semver match, not a literal:
          # the staged template's version is whatever it was last committed
          # at, and nothing keeps a hardcoded literal here in lockstep with it.
          V="$V" perl -i -pe 's/\d+\.\d+\.\d+/$ENV{V}/g' Formula/tolkin.rb

          # Substitute the placeholder sha256 values in order of appearance.
          # The template has four identical zero-filled placeholders; each
          # platform block gets its own real checksum via indexed replacement.
          perl -i -0pe "
            my \$i = 0;
            my @shas = ('${SHA_DARWIN_ARM64}', '${SHA_DARWIN_X64}', '${SHA_LINUX_ARM64}', '${SHA_LINUX_X64}');
            s/0{64}/\$shas[\$i++]/ge
          " Formula/tolkin.rb

          git config user.email "ci@github.com"
          git config user.name "tolkin-publish CI"
          git add Formula/tolkin.rb
          git diff --cached --quiet && echo "Formula already up to date." && exit 0
          git commit -m "tolkin ${V}"
          git push
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
