[package]
name = "tolkin"
version = "0.11.0"
edition = "2021"
description = "Tolkin CLI: privacy-first AI token analyzer"
license = "MIT"
# Distribution is npm platform packages, not crates.io. Flip at OSS extraction.
publish = false

[dependencies]
tolkin-core = { path = "../../packages/tolkin-core/crates/core" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
# Dual Unlicense OR MIT; satisfies deny.toml via the MIT branch.
ignore = "0.4"
tiktoken-rs = "0.12"
tokenizers = { version = "0.23", default-features = false, features = ["onig", "esaxx_fast"] }
pdf-extract = "0.10"
calamine = "0.35"
quick-xml = "0.40"
infer = "0.19"
zip = { version = "7", default-features = false, features = ["deflate"] }
# Already in the tree via serde_json and tolkin-core; direct for derive only.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
dirs = "5"
toml = "0.8"
directories = "6.0.0"
ratatui = "0.29"
crossterm = "0.28"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
